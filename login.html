<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | App Học Từ Vựng Tiếng Anh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <span>Cute Vocab</span>
      </div>
      <p>Làm chủ từ vựng Tiếng Anh mỗi ngày! ✨</p>
    </div>

    <!-- Tab Buttons -->
    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tab-login-btn">Đăng nhập</button>
      <button class="auth-tab-btn" id="tab-register-btn">Đăng ký</button>
    </div>

    <!-- Login Form -->
    <form id="auth-form">
      <div class="form-group">
        <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
        <input type="email" id="email" class="input-control" placeholder="example@email.com" required>
      </div>

      <div class="form-group">
        <label for="password"><i class="fa-solid fa-lock"></i> Mật khẩu</label>
        <input type="password" id="password" class="input-control" placeholder="••••••••" required>
      </div>

      <div class="form-group" id="confirm-password-group" style="display: none;">
        <label for="confirm-password"><i class="fa-solid fa-circle-check"></i> Xác nhận mật khẩu</label>
        <input type="password" id="confirm-password" class="input-control" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary" id="btn-submit">
        <span>Đăng nhập</span> <i class="fa-solid fa-right-to-bracket"></i>
      </button>
    </form>

    <div class="auth-divider">
      <span>Hoặc</span>
    </div>

    <!-- Third Party Auth -->
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <button class="btn btn-google" id="btn-google-login">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        <span>Đăng nhập bằng Google</span>
      </button>

      <div class="demo-link-container">
        <button class="btn btn-demo" id="btn-demo-login">
          <i class="fa-solid fa-bolt"></i> <span>Dùng thử Offline (Demo Mode)</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Alert System -->
  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="./firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
